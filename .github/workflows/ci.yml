name: CI

on:
  push:
    branches: [master, main]
    paths:
      - "projects/starter-project/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "projects/starter-project/**"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: projects/starter-project

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/starter-project/python/requirements.txt
      - name: Install dependencies
        working-directory: projects/starter-project/python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Import check
        working-directory: projects/starter-project/python
        run: python -c "import src.main"

  frontend:
    name: Frontend (Vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: projects/starter-project/web/package-lock.json
      - name: Install dependencies
        working-directory: projects/starter-project/web
        run: npm ci
      - name: Build
        working-directory: projects/starter-project/web
        run: npm run build

  proxy:
    name: Proxy (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: projects/starter-project/server/package-lock.json
      - name: Install dependencies
        working-directory: projects/starter-project/server
        run: npm ci
      - name: Syntax check
        working-directory: projects/starter-project/server
        run: node --check server.js

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend, proxy]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t starter-backend:ci ./python
      - name: Build proxy image
        run: docker build -t starter-proxy:ci ./server
      - name: Build frontend image
        run: docker build -t starter-frontend:ci ./web

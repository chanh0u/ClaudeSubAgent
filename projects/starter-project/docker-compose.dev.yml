# Development overrides: hot reload for backend + Vite dev server for frontend.
# Use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  backend:
    environment:
      - LOG_LEVEL=DEBUG
    volumes:
      - ./python/src:/app/src
    command: ["sh", "-c", "uvicorn src.main:app --host 0.0.0.0 --port ${PORT:-3003} --reload"]

  proxy:
    environment:
      - DEBUG=true
    volumes:
      - ./server/server.js:/app/server.js:ro
    command: ["node", "--watch", "server.js"]

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    # Vite dev server runs on 5173 inside the container
    ports:
      - "5173:5173"
    volumes:
      - ./web/src:/app/src
      - ./web/index.html:/app/index.html
      - /app/node_modules

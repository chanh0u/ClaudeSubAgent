<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TODO 일정 관리</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #6c63ff;
    --primary-dark: #5a52d5;
    --secondary: #ff6584;
    --success: #43d98f;
    --warning: #ffb347;
    --danger: #ff6b6b;
    --bg: #0f0c29;
    --surface: rgba(255,255,255,0.06);
    --surface-hover: rgba(255,255,255,0.1);
    --border: rgba(255,255,255,0.1);
    --text: #f0f0f0;
    --text-muted: rgba(240,240,240,0.5);
    --radius: 16px;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
    --transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    min-height: 100vh;
    color: var(--text);
    padding: 24px 16px;
  }
  .app { max-width: 800px; margin: 0 auto; }
  header {
    text-align: center;
    margin-bottom: 40px;
    animation: fadeInDown 0.6s ease;
  }
  header h1 {
    font-size: 2.6rem;
    font-weight: 800;
    background: linear-gradient(135deg, #a78bfa, #f472b6, #fb923c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }
  header p { color: var(--text-muted); margin-top: 8px; font-size: 1rem; }
  .stats-row {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    animation: fadeInUp 0.6s ease 0.1s both;
  }
  .stat-card {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
    backdrop-filter: blur(10px);
    transition: var(--transition);
  }
  .stat-card:hover { background: var(--surface-hover); transform: translateY(-2px); }
  .stat-num { font-size: 1.8rem; font-weight: 800; }
  .stat-num.total { color: var(--primary); }
  .stat-num.active { color: var(--warning); }
  .stat-num.done { color: var(--success); }
  .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
  .input-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 24px;
    backdrop-filter: blur(10px);
    animation: fadeInUp 0.6s ease 0.2s both;
  }
  .input-row { display: flex; gap: 12px; margin-bottom: 12px; }
  .input-row:last-of-type { margin-bottom: 0; }
  input[type="text"], input[type="date"], select, textarea {
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 12px 16px;
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: var(--transition);
    width: 100%;
  }
  input[type="text"]:focus, input[type="date"]:focus, select:focus, textarea:focus {
    border-color: var(--primary);
    background: rgba(108,99,255,0.1);
    box-shadow: 0 0 0 3px rgba(108,99,255,0.2);
  }
  input[type="text"]::placeholder, textarea::placeholder { color: var(--text-muted); }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }
  select option { background: #302b63; color: var(--text); }
  textarea { resize: vertical; min-height: 72px; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 12px 22px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    font-family: inherit;
    transition: var(--transition);
    white-space: nowrap;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    box-shadow: 0 4px 15px rgba(108,99,255,0.4);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(108,99,255,0.5); }
  .btn-primary:active { transform: translateY(0); }
  .btn-ghost {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: var(--surface-hover); }
  .btn-icon {
    padding: 8px;
    border-radius: 8px;
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 1rem;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
  }
  .btn-icon:hover.edit { color: var(--primary); background: rgba(108,99,255,0.15); }
  .btn-icon:hover.delete { color: var(--danger); background: rgba(255,107,107,0.15); }
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    animation: fadeInUp 0.6s ease 0.3s both;
  }
  .search-wrap { position: relative; flex: 1; min-width: 200px; }
  .search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
  .search-wrap input { padding-left: 40px; }
  .filter-tabs {
    display: flex;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
  }
  .tab {
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    transition: var(--transition);
    color: var(--text-muted);
    border: none;
    background: transparent;
    font-family: inherit;
  }
  .tab.active { background: var(--primary); color: white; box-shadow: 0 2px 8px rgba(108,99,255,0.4); }
  .tab:not(.active):hover { color: var(--text); background: var(--surface-hover); }
  .sort-select { min-width: 140px; }
  .todo-list { display: flex; flex-direction: column; gap: 10px; animation: fadeInUp 0.6s ease 0.4s both; }
  .todo-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    backdrop-filter: blur(10px);
    transition: var(--transition);
    animation: slideIn 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .todo-item::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    border-radius: 3px 0 0 3px;
  }
  .todo-item.priority-high::before { background: var(--danger); }
  .todo-item.priority-medium::before { background: var(--warning); }
  .todo-item.priority-low::before { background: var(--success); }
  .todo-item:hover { background: var(--surface-hover); transform: translateY(-2px); box-shadow: var(--shadow); }
  .todo-item.completed { opacity: 0.55; }
  .todo-item.completed .todo-title { text-decoration: line-through; color: var(--text-muted); }
  .checkbox-wrap { flex-shrink: 0; margin-top: 2px; }
  .checkbox {
    width: 22px; height: 22px;
    border-radius: 6px;
    border: 2px solid var(--border);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    flex-shrink: 0;
  }
  .checkbox:hover { border-color: var(--primary); background: rgba(108,99,255,0.1); }
  .checkbox.checked { background: var(--success); border-color: var(--success); }
  .checkbox svg { opacity: 0; transition: var(--transition); transform: scale(0.5); }
  .checkbox.checked svg { opacity: 1; transform: scale(1); }
  .todo-body { flex: 1; min-width: 0; }
  .todo-title { font-size: 1rem; font-weight: 600; margin-bottom: 4px; word-break: break-word; }
  .todo-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; word-break: break-word; }
  .todo-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .badge-cat { background: rgba(108,99,255,0.2); color: #a78bfa; border: 1px solid rgba(108,99,255,0.3); }
  .badge-date { background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid var(--border); }
  .badge-date.overdue { color: var(--danger); background: rgba(255,107,107,0.1); border-color: rgba(255,107,107,0.3); }
  .badge-pri-high { background: rgba(255,107,107,0.15); color: var(--danger); border: 1px solid rgba(255,107,107,0.3); }
  .badge-pri-medium { background: rgba(255,179,71,0.15); color: var(--warning); border: 1px solid rgba(255,179,71,0.3); }
  .badge-pri-low { background: rgba(67,217,143,0.15); color: var(--success); border: 1px solid rgba(67,217,143,0.3); }
  .todo-actions { display: flex; gap: 4px; flex-shrink: 0; margin-top: 2px; }
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    animation: fadeIn 0.4s ease;
  }
  .empty-state .icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.5; }
  .empty-state p { font-size: 1rem; }
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: all; }
  .modal {
    background: linear-gradient(135deg, #1a1740, #0f0c29);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    width: 100%;
    max-width: 500px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    transform: translateY(20px) scale(0.95);
    transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
  }
  .modal-backdrop.open .modal { transform: translateY(0) scale(1); }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modal-header h2 { font-size: 1.2rem; font-weight: 700; }
  .modal-body > * + * { margin-top: 12px; }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .error-msg { color: var(--danger); font-size: 0.8rem; margin-top: 4px; display: none; }
  .error-msg.show { display: block; }
  .progress-bar {
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    margin-bottom: 24px;
    overflow: hidden;
    animation: fadeIn 0.4s ease;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--success));
    border-radius: 10px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  }
  .label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600; }
  .bulk-actions {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 8px; z-index: 200; }
  .toast {
    background: #1e1a3f;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 20px;
    font-size: 0.9rem;
    box-shadow: var(--shadow);
    animation: toastIn 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 200px;
  }
  .toast.success { border-color: var(--success); }
  .toast.error { border-color: var(--danger); }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes fadeOut { to { opacity: 0; transform: translateX(20px); } }
  @media (max-width: 600px) {
    header h1 { font-size: 1.8rem; }
    .stats-row { gap: 8px; }
    .stat-num { font-size: 1.4rem; }
    .input-row { flex-direction: column; }
    .controls { flex-direction: column; }
    .filter-tabs { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>✦ TODO 일정 관리</h1>
    <p>오늘도 계획적인 하루를 시작해보세요</p>
  </header>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-num total" id="statTotal">0</div>
      <div class="stat-label">전체</div>
    </div>
    <div class="stat-card">
      <div class="stat-num active" id="statActive">0</div>
      <div class="stat-label">진행중</div>
    </div>
    <div class="stat-card">
      <div class="stat-num done" id="statDone">0</div>
      <div class="stat-label">완료</div>
    </div>
  </div>

  <div class="progress-bar" id="progressBar" style="display:none">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="input-card">
    <div class="input-row">
      <div style="flex:1">
        <div class="label">할 일 *</div>
        <input type="text" id="inputTitle" placeholder="할 일을 입력하세요..." maxlength="120">
        <div class="error-msg" id="titleError">할 일을 입력해주세요.</div>
      </div>
    </div>
    <div class="input-row">
      <div style="flex:1">
        <div class="label">메모</div>
        <textarea id="inputDesc" placeholder="상세 내용 (선택사항)..." maxlength="500"></textarea>
      </div>
    </div>
    <div class="input-row">
      <div style="flex:1">
        <div class="label">카테고리</div>
        <select id="inputCat">
          <option value="일반">일반</option>
          <option value="업무">업무</option>
          <option value="개인">개인</option>
          <option value="쇼핑">쇼핑</option>
          <option value="건강">건강</option>
          <option value="학습">학습</option>
          <option value="여행">여행</option>
        </select>
      </div>
      <div style="flex:1">
        <div class="label">우선순위</div>
        <select id="inputPriority">
          <option value="medium">보통</option>
          <option value="high">높음</option>
          <option value="low">낮음</option>
        </select>
      </div>
      <div style="flex:1">
        <div class="label">마감일</div>
        <input type="date" id="inputDate">
      </div>
    </div>
    <div class="input-row" style="justify-content:flex-end">
      <button class="btn btn-primary" onclick="addTodo()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        추가하기
      </button>
    </div>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="검색..." oninput="renderList()">
    </div>
    <div class="filter-tabs">
      <button class="tab active" data-filter="all" onclick="setFilter('all', this)">전체</button>
      <button class="tab" data-filter="active" onclick="setFilter('active', this)">진행중</button>
      <button class="tab" data-filter="completed" onclick="setFilter('completed', this)">완료</button>
    </div>
    <select class="sort-select" id="sortSelect" onchange="renderList()">
      <option value="newest">최신순</option>
      <option value="oldest">오래된순</option>
      <option value="priority">우선순위</option>
      <option value="dueDate">마감일순</option>
      <option value="alpha">이름순</option>
    </select>
  </div>

  <div class="bulk-actions" id="bulkActions" style="display:none">
    <button class="btn btn-ghost" onclick="markAllDone()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      모두 완료
    </button>
    <button class="btn btn-ghost" onclick="deleteCompleted()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      완료 항목 삭제
    </button>
  </div>

  <div class="todo-list" id="todoList"></div>
</div>

<div class="modal-backdrop" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <h2>할 일 수정</h2>
      <button class="btn-icon" onclick="closeModal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div>
        <div class="label">할 일 *</div>
        <input type="text" id="editTitle" placeholder="할 일을 입력하세요..." maxlength="120">
        <div class="error-msg" id="editTitleError">할 일을 입력해주세요.</div>
      </div>
      <div>
        <div class="label">메모</div>
        <textarea id="editDesc" placeholder="상세 내용..."></textarea>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <div style="flex:1;min-width:120px">
          <div class="label">카테고리</div>
          <select id="editCat">
            <option value="일반">일반</option>
            <option value="업무">업무</option>
            <option value="개인">개인</option>
            <option value="쇼핑">쇼핑</option>
            <option value="건강">건강</option>
            <option value="학습">학습</option>
            <option value="여행">여행</option>
          </select>
        </div>
        <div style="flex:1;min-width:120px">
          <div class="label">우선순위</div>
          <select id="editPriority">
            <option value="medium">보통</option>
            <option value="high">높음</option>
            <option value="low">낮음</option>
          </select>
        </div>
        <div style="flex:1;min-width:120px">
          <div class="label">마감일</div>
          <input type="date" id="editDate">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" onclick="saveEdit()">저장하기</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
const STORAGE_KEY = 'todo_app_v2';
let todos = [];
let currentFilter = 'all';
let editingId = null;

function load() {
  try {
    todos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch {
    todos = [];
  }
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function today() {
  return new Date().toISOString().slice(0, 10);
}

function formatDate(d) {
  if (!d) return null;
  const [y, m, day] = d.split('-');
  return `${y}년 ${parseInt(m)}월 ${parseInt(day)}일`;
}

function isOverdue(d) {
  return d && d < today();
}

function priorityLabel(p) {
  return { high: '높음', medium: '보통', low: '낮음' }[p] || '보통';
}

function priorityClass(p) {
  return { high: 'badge-pri-high', medium: 'badge-pri-medium', low: 'badge-pri-low' }[p] || 'badge-pri-medium';
}

function priorityOrder(p) {
  return { high: 0, medium: 1, low: 2 }[p] ?? 1;
}

function addTodo() {
  const titleEl = document.getElementById('inputTitle');
  const title = titleEl.value.trim();
  const errEl = document.getElementById('titleError');

  if (!title) {
    errEl.classList.add('show');
    titleEl.focus();
    titleEl.style.borderColor = 'var(--danger)';
    return;
  }
  errEl.classList.remove('show');
  titleEl.style.borderColor = '';

  const todo = {
    id: genId(),
    title,
    desc: document.getElementById('inputDesc').value.trim(),
    category: document.getElementById('inputCat').value,
    priority: document.getElementById('inputPriority').value,
    dueDate: document.getElementById('inputDate').value || null,
    completed: false,
    createdAt: Date.now()
  };

  todos.unshift(todo);
  save();
  renderList();
  updateStats();
  showToast('할 일이 추가되었습니다', 'success');

  titleEl.value = '';
  document.getElementById('inputDesc').value = '';
  document.getElementById('inputDate').value = '';
  document.getElementById('inputCat').value = '일반';
  document.getElementById('inputPriority').value = 'medium';
  titleEl.focus();
}

function toggleTodo(id) {
  const t = todos.find(x => x.id === id);
  if (!t) return;
  t.completed = !t.completed;
  save();
  renderList();
  updateStats();
  showToast(t.completed ? '완료 처리되었습니다' : '다시 진행 중으로 변경됩니다', 'success');
}

function deleteTodo(id) {
  todos = todos.filter(x => x.id !== id);
  save();
  renderList();
  updateStats();
  showToast('삭제되었습니다', 'success');
}

function openEdit(id) {
  const t = todos.find(x => x.id === id);
  if (!t) return;
  editingId = id;
  document.getElementById('editTitle').value = t.title;
  document.getElementById('editDesc').value = t.desc || '';
  document.getElementById('editCat').value = t.category;
  document.getElementById('editPriority').value = t.priority;
  document.getElementById('editDate').value = t.dueDate || '';
  document.getElementById('editModal').classList.add('open');
}

function closeModal() {
  document.getElementById('editModal').classList.remove('open');
  document.getElementById('editTitleError').classList.remove('show');
  editingId = null;
}

function saveEdit() {
  const title = document.getElementById('editTitle').value.trim();
  const errEl = document.getElementById('editTitleError');

  if (!title) {
    errEl.classList.add('show');
    document.getElementById('editTitle').focus();
    return;
  }
  errEl.classList.remove('show');

  const t = todos.find(x => x.id === editingId);
  if (!t) return;
  t.title = title;
  t.desc = document.getElementById('editDesc').value.trim();
  t.category = document.getElementById('editCat').value;
  t.priority = document.getElementById('editPriority').value;
  t.dueDate = document.getElementById('editDate').value || null;

  save();
  renderList();
  updateStats();
  closeModal();
  showToast('수정되었습니다', 'success');
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

function getFilteredSorted() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const sort = document.getElementById('sortSelect').value;

  let list = todos.filter(t => {
    if (currentFilter === 'active' && t.completed) return false;
    if (currentFilter === 'completed' && !t.completed) return false;
    if (q && !t.title.toLowerCase().includes(q) && !(t.desc || '').toLowerCase().includes(q)) return false;
    return true;
  });

  list.sort((a, b) => {
    if (sort === 'newest') return b.createdAt - a.createdAt;
    if (sort === 'oldest') return a.createdAt - b.createdAt;
    if (sort === 'priority') return priorityOrder(a.priority) - priorityOrder(b.priority);
    if (sort === 'dueDate') {
      if (!a.dueDate && !b.dueDate) return 0;
      if (!a.dueDate) return 1;
      if (!b.dueDate) return -1;
      return a.dueDate.localeCompare(b.dueDate);
    }
    if (sort === 'alpha') return a.title.localeCompare(b.title, 'ko');
    return 0;
  });

  return list;
}

function renderList() {
  const list = getFilteredSorted();
  const el = document.getElementById('todoList');

  if (list.length === 0) {
    el.innerHTML = `<div class="empty-state">
      <div class="icon">📋</div>
      <p>${currentFilter === 'completed' ? '완료된 항목이 없습니다' : currentFilter === 'active' ? '진행 중인 항목이 없습니다' : '할 일을 추가해보세요!'}</p>
    </div>`;
    document.getElementById('bulkActions').style.display = 'none';
    return;
  }

  document.getElementById('bulkActions').style.display = 'flex';

  el.innerHTML = list.map(t => {
    const overdue = !t.completed && isOverdue(t.dueDate);
    return `<div class="todo-item priority-${t.priority} ${t.completed ? 'completed' : ''}">
      <div class="checkbox-wrap">
        <div class="checkbox ${t.completed ? 'checked' : ''}" onclick="toggleTodo('${t.id}')">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
      </div>
      <div class="todo-body">
        <div class="todo-title">${escHtml(t.title)}</div>
        ${t.desc ? `<div class="todo-desc">${escHtml(t.desc)}</div>` : ''}
        <div class="todo-meta">
          <span class="badge badge-cat">${escHtml(t.category)}</span>
          <span class="badge ${priorityClass(t.priority)}">${priorityLabel(t.priority)}</span>
          ${t.dueDate ? `<span class="badge badge-date ${overdue ? 'overdue' : ''}">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            ${overdue ? '⚠ ' : ''}${formatDate(t.dueDate)}
          </span>` : ''}
        </div>
      </div>
      <div class="todo-actions">
        <button class="btn-icon edit" onclick="openEdit('${t.id}')" title="수정">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="btn-icon delete" onclick="deleteTodo('${t.id}')" title="삭제">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      </div>
    </div>`;
  }).join('');
}

function updateStats() {
  const total = todos.length;
  const done = todos.filter(t => t.completed).length;
  const active = total - done;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statActive').textContent = active;
  document.getElementById('statDone').textContent = done;
  const pb = document.getElementById('progressBar');
  const pf = document.getElementById('progressFill');
  if (total > 0) {
    pb.style.display = 'block';
    pf.style.width = `${Math.round((done / total) * 100)}%`;
  } else {
    pb.style.display = 'none';
  }
}

function markAllDone() {
  todos.forEach(t => { t.completed = true; });
  save();
  renderList();
  updateStats();
  showToast('모든 항목을 완료 처리했습니다', 'success');
}

function deleteCompleted() {
  const count = todos.filter(t => t.completed).length;
  if (!count) { showToast('완료된 항목이 없습니다', 'error'); return; }
  todos = todos.filter(t => !t.completed);
  save();
  renderList();
  updateStats();
  showToast(`${count}개 항목을 삭제했습니다`, 'success');
}

function showToast(msg, type = 'success') {
  const c = document.getElementById('toastContainer');
  const icons = { success: '✓', error: '✕' };
  const div = document.createElement('div');
  div.className = `toast ${type}`;
  div.innerHTML = `<span>${icons[type]}</span><span>${msg}</span>`;
  c.appendChild(div);
  setTimeout(() => {
    div.style.animation = 'fadeOut 0.3s ease forwards';
    setTimeout(() => div.remove(), 300);
  }, 2500);
}

function escHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

document.getElementById('inputTitle').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTodo();
});

document.getElementById('editModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

document.getElementById('editTitle').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveEdit();
  if (e.key === 'Escape') closeModal();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

document.getElementById('inputTitle').addEventListener('input', () => {
  if (document.getElementById('inputTitle').value.trim()) {
    document.getElementById('titleError').classList.remove('show');
    document.getElementById('inputTitle').style.borderColor = '';
  }
});

load();
renderList();
updateStats();
</script>
</body>
</html>
